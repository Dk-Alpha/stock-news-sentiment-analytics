version: "3.8"

# NOTE: Ollama runs natively on your Windows host (for GPU/CPU access).
# Postgres also runs natively - no need to run it in Docker.
# The pipeline connects to Ollama at http://localhost:11434 (default)
# and Postgres at localhost:5432

services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: pipeline_user
      POSTGRES_PASSWORD: CHANGE_ME
      POSTGRES_DB: news_pipeline
    ports:
      - "5432:5432"
    networks:
      - pipeline_net

  zookeeper:
    image: zookeeper:3.9
    container_name: zookeeper
    environment:
      ZOO_MY_ID: 1
      ZOO_PORT: 2181
    ports:
      - "2181:2181"
    networks:
      - pipeline_net

  kafka:
    image: wurstmeister/kafka:2.13-2.8.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 12
    networks:
      - pipeline_net

  api:
    build:
      context: ../pipeline
    container_name: pipeline_api
    depends_on:
      - kafka
      - postgres
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PASSWORD=CHANGE_ME
      - POSTGRES_DB=news_pipeline
      - POSTGRES_USER=pipeline_user
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    volumes:
      - ../ui:/ui
    ports:
      - "8000:8000"
    networks:
      - pipeline_net

  ingester:
    build:
      context: ../pipeline
    container_name: pipeline_ingester
    command: ["python", "ingester.py"]
    depends_on:
      - kafka
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - pipeline_net

  stream_processor:
    build:
      context: ../pipeline
    container_name: pipeline_stream_processor
    command: ["python", "stream_processor.py"]
    depends_on:
      - kafka
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - pipeline_net

  llm_worker:
    build:
      context: ../pipeline
    container_name: pipeline_llm_worker
    command: ["python", "llm_worker.py"]
    depends_on:
      - kafka
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # Connect to host's Ollama natively from inside docker:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    networks:
      - pipeline_net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  storage_worker:
    build:
      context: ../pipeline
    container_name: pipeline_storage_worker
    command: ["python", "storage_worker.py"]
    depends_on:
      - kafka
      - postgres
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PASSWORD=CHANGE_ME
      - POSTGRES_DB=news_pipeline
      - POSTGRES_USER=pipeline_user
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - pipeline_net

  alert_worker:
    build:
      context: ../pipeline
    container_name: pipeline_alert_worker
    command: ["python", "alert_worker.py"]
    depends_on:
      - kafka
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - pipeline_net

networks:
  pipeline_net:
    driver: bridge
